<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Login Admin — Sekar Jagad 43</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">

  <!-- Fonts (selaras website utama) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">

  <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico">

  <style>
    /* ═══ TOKENS — sama dengan style.css situs utama ═══ */
    :root {
      --brand: oklch(0.30 0.030 258);
      --brand-light: oklch(0.42 0.035 258);
      --brand-dark: oklch(0.22 0.025 258);
      --accent: oklch(0.58 0.085 62);
      --accent-light: oklch(0.70 0.070 62);
      --accent-dark: oklch(0.45 0.080 62);
      --accent-bg: oklch(0.58 0.085 62 / 0.12);
      --bg: oklch(0.98 0.002 60);
      --ink: oklch(0.13 0.008 258);
      --ink-muted: oklch(0.50 0.015 258);
      --white: oklch(1 0 0);
      --r-sm: 6px;
      --r-md: 12px;
      --r-lg: 20px;
      --r-full: 9999px;
      --shadow-md: 0 6px 24px oklch(0 0 0 / 0.08);
      --shadow-lg: 0 12px 48px oklch(0 0 0 / 0.12);
      --shadow-accent: 0 4px 20px oklch(0.58 0.085 62 / 0.25);
      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
      --dur-fast: 200ms;
      --font-display: 'Inter', system-ui, -apple-system, sans-serif;
      --font-body: 'Inter', system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    a { text-decoration: none; color: inherit; }

    body {
      font-family: var(--font-body);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      background: linear-gradient(150deg, var(--brand-dark) 0%, var(--brand) 55%, var(--brand-light) 100%);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Ornamen halus di latar (noise ringan, selaras hero situs) */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0.05;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
      pointer-events: none;
    }

    .login-shell {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 400px;
    }

    /* Kartu login — putih, radius, shadow halus (gaya kartu situs) */
    .login-card {
      background: var(--white);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-lg);
      padding: 40px 36px;
      text-align: center;
    }

    .login-logo-badge {
      width: 76px;
      height: 76px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--white);
    }

    .login-logo-badge img {
      height: 44px;
      width: auto;
      display: block;
    }

    .login-card h1 {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.01em;
    }

    .login-card .login-sub {
      color: var(--ink-muted);
      font-size: 0.875rem;
      margin-top: 6px;
      margin-bottom: 28px;
    }

    .login-error {
      background: oklch(0.62 0.22 25 / 0.12);
      color: oklch(0.48 0.20 25);
      border-radius: var(--r-sm);
      padding: 10px 14px;
      font-size: 0.85rem;
      margin-bottom: 18px;
      display: none;
      text-align: left;
    }
    .login-error.show { display: block; }

    .login-field {
      text-align: left;
      margin-bottom: 18px;
    }

    .login-field label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 6px;
    }

    .login-field input {
      width: 100%;
      padding: 12px 14px;
      font-size: 0.95rem;
      color: var(--ink);
      background: var(--white);
      border: 1.5px solid oklch(0 0 0 / 0.12);
      border-radius: var(--r-md);
      transition: border-color var(--dur-fast) var(--ease-out-expo),
                  box-shadow var(--dur-fast) var(--ease-out-expo);
    }

    .login-field input::placeholder {
      color: oklch(0.50 0.015 258 / 0.6);
    }

    .login-field input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-bg);
    }

    .login-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px 24px;
      margin-top: 6px;
      font-family: var(--font-body);
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--white);
      background: var(--accent);
      border: 0;
      border-radius: var(--r-full);
      box-shadow: var(--shadow-accent);
      cursor: pointer;
      transition: transform var(--dur-fast) var(--ease-out-expo),
                  box-shadow var(--dur-fast) var(--ease-out-expo);
    }

    .login-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 28px oklch(0.58 0.085 62 / 0.35);
    }

    .login-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .login-back {
      display: inline-block;
      margin-top: 22px;
      font-size: 0.85rem;
      color: var(--ink-muted);
      transition: color var(--dur-fast);
    }

    .login-back:hover {
      color: var(--brand);
    }
  </style>
</head>

<body>
  <!-- ═══════════════ LOGIN PAGE (gaya website utama) ═══════════════ -->
  <div class="login-shell">
    <div class="login-card">
      <a href="index.html" class="login-logo-badge" aria-label="Kembali ke situs">
        <img src="assets/images/logo-white.png" alt="Sekar Jagad 43">
      </a>
      <h1>Panel Admin</h1>
      <p class="login-sub">Sekar Jagad 43 — Masuk untuk mengelola konten</p>

      <div class="login-error" id="loginError" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="login-field">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" placeholder="nama@email.com" autocomplete="email" required>
        </div>
        <div class="login-field">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <button type="submit" class="login-btn" id="loginBtn">Masuk</button>
      </form>

      <a href="index.html" class="login-back">&larr; Kembali ke situs</a>
    </div>
  </div>

  <!-- Scripts -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js?v=5"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/admin-login.js"></script>
</body>
</html>
